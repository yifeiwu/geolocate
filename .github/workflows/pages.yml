name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    # Geoscape publishes quarterly (Feb / May / Aug / Nov). Rebuild a few days
    # after each release so the site picks up boundary and postcode changes.
    - cron: '17 4 20 2,5,8,11 *'
  workflow_dispatch:
    inputs:
      max_hops:
        description: 'Maximum hop distance to precompute'
        default: '3'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The client resolves its own site root from the script URL, so the same
      # build works at / (user site) and /geolocate/ (project site).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Key the source cache on the actual upstream release rather than the run
      # id, so a push does not re-download ~400 MB but a new Geoscape quarterly
      # release (or a newly published ASGS edition) does invalidate it.
      - name: Resolve source cache key
        id: cachekey
        run: echo "key=$(python -m pipeline.cache_key | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache source data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ steps.cachekey.outputs.key }}

      - name: Build dataset
        run: python -m pipeline.run --out site --max-hops "${{ github.event.inputs.max_hops || 3 }}"

      - name: Verify client/data parity
        run: python -m pipeline.verify_client --site site

      - name: Verify site/data consistency
        run: python -m pipeline.verify_site

      - name: Check output size
        run: |
          size=$(du -sm site | cut -f1)
          echo "site size: ${size} MB"
          if [ "$size" -gt 1000 ]; then
            echo "::error::site exceeds the 1 GB GitHub Pages limit"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
